<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>
</head>
<body>
    <h1>Student List</h1>

    <a href="/add/">Add New Student</a>
    <br><br>

<table border="1" cellpadding="10">
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Age</th>
        <th>Action</th>  
    </tr>

{% for s in students %}
<tr>
    <td>{{ s.name }}</td>
    <td>{{ s.email }}</td>
    <td>{{ s.age }}</td>
    <td>
        <a href="/edit/{{ s.id }}/">Edit</a> |
        <a href="/delete/{{ s.id }}/">Delete</a>
    </td>
</tr>
{% endfor %}
    </table>
</body>
</html>
